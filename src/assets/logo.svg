<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100" role="img" aria-labelledby="title desc">
  <title id="title">Aditiya Logo</title>
  <desc id="desc">Circular gradient mark with stylized letter A and the name Aditiya</desc>

  <defs>
    <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="100%" stop-color="#ffb86b" />
    </linearGradient>
  </defs>

  <!-- Circle Logo -->
  <circle cx="50" cy="50" r="40" fill="url(#gradA)" />

  <!-- Stylized 'A' -->
  <text x="50" y="65" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="44" text-anchor="middle" fill="#fff">
    A
  </text>

  <!-- Wordmark -->
  <text x="120" y="65" font-family="Poppins, Arial, sans-serif" font-weight="600" font-size="34" fill="#222">
    Aditiya
  </text>
</svg>
